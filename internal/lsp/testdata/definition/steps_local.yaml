---
name: "jump from steps.<id> to the step id"
document: |
  schemaVersion: scenario/v1
  steps:
    - id: login
      protocol: http
      request:
        method: POST
        url: http://example.com/login
    - protocol: http
      request:
        method: GET
        url: http://example.com/me
        header:
          Authorization: 'Bearer {{steps.lo$0gin.response.body.token}}'
operation: definition
expect:
  definitionUri:
    suffix: "test.yaml"
    startLine: 2
    startChar: 8
    endLine: 2
    endChar: 13
---
name: "jump from steps.<id> in if to a quoted step id"
document: |
  schemaVersion: scenario/v1
  steps:
    - id: "find"
      protocol: http
      request:
        method: GET
        url: http://example.com
    - if: '{{steps.$0find.result == "failed"}}'
      protocol: http
      request:
        method: POST
        url: http://example.com
operation: definition
expect:
  definitionUri:
    suffix: "test.yaml"
    startLine: 2
    startChar: 9
    endLine: 2
    endChar: 13
---
name: "no jump for an undefined step"
document: |
  schemaVersion: scenario/v1
  steps:
    - id: login
      protocol: http
      request:
        method: GET
        url: '{{steps.nope$0.result}}'
operation: definition
expect:
  definitionIsNull: true
---
name: "the step under the cursor in an expression with several steps"
document: |
  schemaVersion: scenario/v1
  steps:
    - id: a
      protocol: http
    - id: b
      protocol: http
    - if: '{{steps.a.result == "passed" && steps.b$0.result == "passed"}}'
      protocol: http
operation: definition
expect:
  definitionUri:
    suffix: "test.yaml"
    startLine: 4
    startChar: 8
    endChar: 9
---
name: "only step ids count, in the document of the reference"
document: |
  schemaVersion: scenario/v1
  vars:
    id: login
  steps:
    - id: first
      protocol: http
      request:
        method: POST
        url: http://example.com
        body:
          id: login
  ---
  schemaVersion: scenario/v1
  steps:
    - id: login
      protocol: http
    - protocol: http
      request:
        method: GET
        url: '{{steps.lo$0gin.result}}'
operation: definition
expect:
  definitionUri:
    suffix: "test.yaml"
    startLine: 14
    startChar: 8
    endChar: 13
---
name: "the bind of an include step jumps to the included scenario's step"
files:
  login.yaml: |
    schemaVersion: scenario/v1
    steps:
      - id: login
        protocol: http
document: |
  schemaVersion: scenario/v1
  steps:
    - id: login
      protocol: http
    - include: login.yaml
      bind:
        vars:
          result: '{{steps.lo$0gin.result}}'
operation: definition
expect:
  definitionUri:
    suffix: "login.yaml"
    startLine: 2
    startChar: 8
    endChar: 13
---
name: "an empty document between scenarios does not hide them"
document: |
  schemaVersion: scenario/v1
  steps:
    - id: login
      protocol: http
    - protocol: http
      request:
        method: GET
        url: '{{steps.lo$0gin.result}}'
  ---
  ---
  schemaVersion: scenario/v1
  steps: []
operation: definition
expect:
  definitionUri:
    suffix: "test.yaml"
    startLine: 2
    startChar: 8
    endChar: 13
