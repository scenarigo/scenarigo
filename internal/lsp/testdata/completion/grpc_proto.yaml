---
name: "service names from the proto files"
files:
  proto/greeter.proto: |
    syntax = "proto3";
    package test.v1;
    import "common.proto";
    // Greeter greets.
    service Greeter {
      // Hello says hello.
      rpc Hello(HelloRequest) returns (HelloReply);
      rpc Chat(stream HelloRequest) returns (stream HelloReply);
    }
    message HelloRequest {
      // user_name is the name to greet.
      string user_name = 1;
      Address address = 2;
      repeated Address addresses = 3;
      map<string, Address> by_key = 4;
      oneof contact {
        string email = 5;
        string phone = 6;
      }
      common.Tag tag = 7;
    }
    message Address { string city = 1; }
    message HelloReply { string message = 1; }
  proto/common.proto: |
    syntax = "proto3";
    package common;
    message Tag { string label = 1; }
document: |
  schemaVersion: scenario/v1
  steps:
    - protocol: grpc
      request:
        target: localhost:50051
        options:
          proto:
            imports: [proto]
            files: [greeter.proto]
        service: $0
operation: completion
expect:
  completionLabels:
    contains: [test.v1.Greeter]

