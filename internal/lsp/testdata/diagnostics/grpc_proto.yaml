---
name: "well-known messages are checked unless they have a JSON form of their own"
files:
  proto/greeter.proto: |
    syntax = "proto3";
    package test.v1;
    import "google/protobuf/empty.proto";
    import "google/protobuf/struct.proto";
    import "google/protobuf/timestamp.proto";
    service Greeter {
      rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
      rpc Put(Item) returns (google.protobuf.Empty);
    }
    message Item {
      google.protobuf.Timestamp at = 1;
      google.protobuf.Struct attrs = 2;
      google.protobuf.Empty nothing = 3;
    }
document: |
  schemaVersion: scenario/v1
  steps:
    - protocol: grpc
      request:
        options:
          proto:
            imports: [proto]
            files: [greeter.proto]
        service: test.v1.Greeter
        method: Ping
        message:
          foo: 1
    - protocol: grpc
      request:
        options:
          proto:
            imports: [proto]
            files: [greeter.proto]
        service: test.v1.Greeter
        method: Put
        message:
          at: "2020-01-01T00:00:00Z"
          attrs:
            any: thing
          nothing:
            bar: 1
operation: diagnostics
expect:
  diagnosticCount: 2
  diagnostics:
    - message: 'unknown field "foo" in google.protobuf.Empty'
      severity: 2
      startLine: 11
    - message: 'unknown field "bar" in google.protobuf.Empty'
      severity: 2
      startLine: 25

