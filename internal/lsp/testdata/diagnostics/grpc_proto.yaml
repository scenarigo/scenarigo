---
name: "merged keys overridden by explicit ones are not set twice"
files:
  proto/svc.proto: |
    syntax = "proto3";
    package t;
    import "google/protobuf/struct.proto";
    service S {
      rpc Hello(Req) returns (Reply);
      rpc Chat(stream Req) returns (stream Reply);
    }
    message Req {
      string user_name = 1;
      string id = 2;
      string title = 3;
      string method = 4;
      repeated Item items = 5;
      oneof contact {
        string email = 6;
        string phone = 7;
        google.protobuf.Value any = 9;
      }
      string message = 8;
    }
    message Item { string name = 1; int32 age = 2; }
    message Reply { string message = 1; string code = 2; }
document: |
  schemaVersion: scenario/v1
  steps:
    - protocol: grpc
      request:
        options:
          proto:
            imports: [proto]
            files: [svc.proto]
        service: t.S
        method: Hello
        message: &base {userName: a, email: x}
    - protocol: grpc
      request:
        options:
          proto:
            imports: [proto]
            files: [svc.proto]
        service: t.S
        method: Hello
        message: {<<: *base, userName: b, email: y}
operation: diagnostics
expect:
  diagnosticCount: 0

