---
name: "ytt/v1 document with files has no diagnostics"
document: |
  schemaVersion: ytt/v1
  files:
  - template.ytt.yaml
  - values.ytt.yaml
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "unknown key in a ytt/v1 document is reported"
document: |
  schemaVersion: ytt/v1
  files:
  - template.ytt.yaml
  steps: []
operation: diagnostics
expect:
  diagnosticMessages:
    contains:
      - 'unknown field "steps"'
---
name: "values that a ytt annotation fills in are not type-checked"
document: |
  #@ load("@ytt:data", "data")
  #@ for params in data.values:
  ---
  schemaVersion: scenario/v1
  title: #@ params.title
  steps:
  - title: #@ params.title
    protocol: http
    request:
      method: #@ params.request.method
      url: #@ params.request.url
    #@ if/end hasattr(params, "timeout"):
    timeout: #@ params.timeout
  #@ end
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "a quoted key before a ytt annotation"
document: |
  schemaVersion: scenario/v1
  "title": #@ params.title
  'description': #@ params.description
  steps: []
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "a null value without a ytt annotation is still type-checked"
document: |
  schemaVersion: scenario/v1
  title: # plain comment
  steps:
  - title: step
    protocol: http
    request:
      method: GET
      url: http://example.com
operation: diagnostics
expect:
  diagnosticMessages:
    contains:
      - 'field "title" expects string, got null'
---
name: "a file with a ytt/v1 document and a scenario document"
document: |
  schemaVersion: ytt/v1
  files:
  - template.ytt.yaml
  ---
  schemaVersion: scenario/v1
  title: plain scenario
  steps:
    - protocol: http
      request:
        method: GET
        url: http://example.com
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "a document without schemaVersion after ytt/v1 is a scenario"
document: |
  schemaVersion: ytt/v1
  files: [a.yaml]
  ---
  title: x
  steps:
    - protocol: http
      request:
        method: GET
        url: http://example.com
operation: diagnostics
expect:
  diagnosticCount: 0
