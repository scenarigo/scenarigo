---
name: "steps reached through an alias or a merge key define their ids"
document: |
  schemaVersion: scenario/v1
  anchors:
    login: &login
      id: login
      protocol: http
      request:
        method: GET
        url: http://example.com
    base: &base
      id: base
      protocol: http
  steps:
    - *login
    - <<: *base
      request:
        method: GET
        url: http://example.com
    - protocol: http
      request:
        method: GET
        url: '{{steps.login.result}}/{{steps.base.result}}'
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "anchors are not evaluated"
document: |
  schemaVersion: scenario/v1
  anchors:
    step: &step
      title: 'GET {{ id }'
      description: '{{nope}}'
  steps: []
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "an included scenario can use the plugins and vars of the including one"
files:
  parent.yaml: |
    schemaVersion: scenario/v1
    plugins:
      grpc: grpc.so
    vars:
      host: localhost
    steps:
      - include: test.yaml
document: |
  schemaVersion: scenario/v1
  steps:
    - protocol: grpc
      request:
        client: '{{plugins.grpc.Client}}'
        target: '{{vars.host}}'
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "?? and defined() absorb only a path"
document: |
  schemaVersion: scenario/v1
  steps:
    - id: login
      if: '{{steps.lgoin.result == "passed" ?? false}}'
      protocol: http
      request:
        method: GET
        url: '{{(hots) ?? 1}}/{{defined(hots2 + 1)}}/{{vars.ok ?? 1}}/{{defined(vars.ok2)}}'
operation: diagnostics
expect:
  diagnosticCount: 4
  diagnostics:
    - message: 'no step with the id "lgoin" has run before this point of the scenario'
      severity: 2
    - message: 'unknown template name "hots"'
      severity: 2
    - message: 'unknown template name "hots2"'
      severity: 2
    - message: 'invalid template: defined() takes a name such as vars.x'
      severity: 1
---
name: "a missing operand is an error"
document: |
  schemaVersion: scenario/v1
  steps:
    - protocol: http
      request:
        method: GET
        url: '{{1 ==}}'
        query:
          a: '{{!}}'
          b: '{{}}'
operation: diagnostics
expect:
  diagnosticCount: 2
  diagnostics:
    - message: 'invalid template: missing operand'
      severity: 1
      startLine: 5
      startChar: 16
      endChar: 18
---
name: "names are defined in evaluation order"
document: |
  schemaVersion: scenario/v1
  vars:
    a: 1
    b: '{{vars.a}}'
  steps:
    - id: first
      if: '{{steps.first.result == "passed" || steps.second.result == "passed"}}'
      vars:
        own: 1
      protocol: http
      request:
        method: GET
        url: '{{vars.own}}/{{vars.bound}}'
      bind:
        vars:
          bound: '{{steps.first.result}}'
    - id: second
      if: '{{vars.own}}'
      protocol: http
      request:
        method: GET
        url: '{{vars.bound}}/{{steps.first.result}}'
operation: diagnostics
expect:
  diagnosticCount: 6
  diagnostics:
    - message: 'vars.a is not defined before this point (a plugin setup may define it)'
      startLine: 3
    - message: 'no step with the id "first" has run before this point of the scenario'
      startLine: 6
    - message: 'no step with the id "second" has run before this point of the scenario'
      startLine: 6
    - message: 'vars.bound is not defined before this point (a plugin setup may define it)'
      startLine: 12
    - message: 'vars.own is not defined before this point (a plugin setup may define it)'
      startLine: 17
---
name: "the bind of an include step sees the steps and vars of the included scenario"
files:
  login.yaml: |
    schemaVersion: scenario/v1
    vars:
      token: x
    steps:
      - id: login
        protocol: http
        request:
          method: GET
          url: http://example.com
document: |
  schemaVersion: scenario/v1
  steps:
    - id: parent
      protocol: http
      request:
        method: GET
        url: http://example.com
    - include: login.yaml
      bind:
        vars:
          token: '{{vars.token}}'
          result: '{{steps.login.result}}'
          parent: '{{steps.parent.result}}'
operation: diagnostics
expect:
  diagnosticCount: 1
  diagnostics:
    - message: 'no step with the id "parent" has run before this point of the scenario'
      startLine: 12
---
name: "the gRPC options of scenarigo.yaml are templates"
document: |
  schemaVersion: config/v1
  protocols:
    grpc:
      request:
        auth:
          tls:
            certificate: '{{env.CERT'
operation: diagnostics
expect:
  diagnosticCount: 1
  diagnostics:
    - message: "invalid template: expected '}}', found 'EOF'"
      severity: 1
      startLine: 6
---
name: "an include step passes its vars to the included scenario"
files:
  parent.yaml: |
    schemaVersion: scenario/v1
    steps:
      - include: test.yaml
        vars:
          user: alice
        secrets:
          password: x
document: |
  schemaVersion: scenario/v1
  steps:
    - protocol: http
      request:
        method: GET
        url: '{{vars.user}}/{{secrets.password}}'
operation: diagnostics
expect:
  diagnosticCount: 0
---
name: "a step anchored and aliased is reported once"
document: |
  schemaVersion: scenario/v1
  steps:
    - &s
      protocol: http
      request:
        method: GET
        url: 'http://{{hots}}'
    - *s
operation: diagnostics
expect:
  diagnosticCount: 1
---
name: "names in the protocols of scenarigo.yaml come from the steps"
document: |
  schemaVersion: config/v1
  protocols:
    grpc:
      request:
        auth:
          tls:
            certificate: '{{plugins.certs.Path}}/{{vars.cert}}/{{hots}}'
operation: diagnostics
expect:
  diagnosticCount: 1
  diagnostics:
    - message: 'unknown template name "hots"'
